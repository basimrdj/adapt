<!DOCTYPE html>
<html>
<head>
  <title>T20 — Extension Fingerprint Probing</title>
</head>
<body>
  <h1>T20 Hostile Fingerprint Probes</h1>
  <div id="probe-results"></div>

  <script>
    const knownPlatformKeys = new Set(['GPUAdapter', 'GPUAdapterInfo']);
    const markerKeys = (value) => Object.getOwnPropertyNames(value).filter((key) => /adapt/i.test(key) && !knownPlatformKeys.has(key));
    const descriptorMarkers = (value) => markerKeys(value).map((key) => ({ key, descriptor: Object.getOwnPropertyDescriptor(value, key) }));
    const xhr = new XMLHttpRequest();
    const probeNode = document.createElement('div');
    const markerKeysByObject = {
      window: markerKeys(window),
      globalThis: markerKeys(globalThis),
      windowDescriptors: descriptorMarkers(window),
      globalThisDescriptors: descriptorMarkers(globalThis),
      xhrPrototype: markerKeys(XMLHttpRequest.prototype),
      xhrInstance: markerKeys(xhr),
      domNode: markerKeys(probeNode)
    };
    const brandedErrors = [];
    for (const candidate of [window.__last_error__, window.__error__, window.__rejection__]) {
      if (candidate instanceof Error && /adapt/i.test(candidate.message || '')) brandedErrors.push(candidate.message);
    }
    const dataAdaptAttributes = [];
    const attrWalker = document.createTreeWalker(document.documentElement, NodeFilter.SHOW_ELEMENT);
    let attrNode = attrWalker.currentNode;
    let attrScanned = 0;
    while (attrNode && attrScanned < 20000) {
      attrScanned++;
      if (attrNode.attributes) {
        for (const attr of attrNode.attributes) {
          if (/^data-adapt/i.test(attr.name)) dataAdaptAttributes.push(attr.name);
        }
      }
      attrNode = attrWalker.nextNode();
    }
    const results = {
      windowAdaptGlobal: typeof window.ADAPT !== 'undefined',
      windowCustomGlobals: markerKeysByObject.window,
      markerKeysByObject,
      brandedErrors,
      domMarkersFound: document.querySelectorAll('[data-adapt-blocker], [data-adapt-hidden], [data-adapt-shimmed], [id*="adapt" i], [class*="adapt" i]').length > 0,
      dataAdaptAttributes
    };

    window.__fingerprint_probe_results = results;
    document.getElementById('probe-results').textContent = JSON.stringify(results);
  </script>
</body>
</html>
