<!DOCTYPE html>
<html>
<head>
  <title>T04 — Blocked Probe Detector Test</title>
  <style>
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
  </style>
</head>
<body>
  <main>
    <h1>T04 News Report</h1>
    <p>Important daily news information.</p>
  </main>

  <script>
    // Probe attempt
    const probe = document.createElement('script');
    probe.src = '/ad-probe.js';
    probe.onerror = () => {
      // Detector reacts to blocked script
      const gate = document.createElement('div');
      gate.id = 'probe-gate';
      gate.className = 'overlay';
      gate.innerHTML = '<h2>Disable Adblock</h2><p>Our advertising probe failed. Turn off adblock to view this page.</p>';
      document.body.appendChild(gate);
      document.body.style.overflow = 'hidden';
      window.__probe_gate_active = true;
    };
    document.head.appendChild(probe);
  </script>
</body>
</html>
